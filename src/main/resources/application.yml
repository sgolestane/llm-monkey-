server:
  port: 4000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: llm-monkey
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/llmmonkey}
    username: ${SPRING_DATASOURCE_USERNAME:llmmonkey}
    password: ${SPRING_DATASOURCE_PASSWORD:llmmonkey}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: llm-monkey

llm-monkey:
  master-key: ${LLM_MONKEY_MASTER_KEY:}
  model-list:
    - model-name: "gpt-4"
      provider: "openai"
      params:
        model: "gpt-4"
        api-key: "${OPENAI_API_KEY:}"
        api-base: "https://api.openai.com/v1"
    - model-name: "gpt-4o"
      provider: "openai"
      params:
        model: "gpt-4o"
        api-key: "${OPENAI_API_KEY:}"
        api-base: "https://api.openai.com/v1"
    - model-name: "claude-sonnet"
      provider: "anthropic"
      params:
        model: "claude-sonnet-4-20250514"
        api-key: "${ANTHROPIC_API_KEY:}"
        api-base: "https://api.anthropic.com"
  router-settings:
    routing-strategy: "round-robin"
    num-retries: 2
    timeout-seconds: 300
    allowed-fails: 3
    cooldown-seconds: 60
  general-settings:
    database-enabled: true
    cache-enabled: true
    rate-limit-enabled: true
  k8s-auth:
    enabled: false
    # audience: "llm-monkey"
    # api-server-url: "https://kubernetes.default.svc"
    # ca-cert-path: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    # service-account-token-path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
