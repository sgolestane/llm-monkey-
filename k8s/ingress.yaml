apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-monkey
  labels:
    app: llm-monkey
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - llm-monkey.example.com
      secretName: llm-monkey-tls
  rules:
    - host: llm-monkey.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-monkey
                port:
                  number: 80
