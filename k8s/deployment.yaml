apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-monkey
  labels:
    app: llm-monkey
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-monkey
  template:
    metadata:
      labels:
        app: llm-monkey
    spec:
      terminationGracePeriodSeconds: 35
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: llm-monkey
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: llm-monkey
          image: llm-monkey:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: llm-monkey-config
            - secretRef:
                name: llm-monkey-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
